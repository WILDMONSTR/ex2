<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Grid Jumper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0D0F1A;
    --surface:#151830;
    --surface-2:#1C2044;
    --line:#2A2F55;
    --text:#EDEFF7;
    --text-muted:#8B91B8;
    --accent:#5EE6C0;
    --accent-2:#FFC857;
    --danger:#FF6B5E;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:'Space Grotesk', sans-serif;
  }

  body{
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    min-height:100vh;
  }

  .app{
    width:100%;
    max-width:680px;
    display:flex;
    flex-direction:column;
    gap:16px;
  }

  .head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    padding-bottom:12px;
    border-bottom:1px solid var(--line);
  }

  .head h1{
    margin:0;
    font-size:22px;
    font-weight:700;
    letter-spacing:0.2px;
  }

  .stats{
    display:flex;
    gap:20px;
    font-size:14px;
    color:var(--text-muted);
  }

  .stats b{
    color:var(--text);
    font-weight:700;
    font-size:16px;
  }

  .stage{
    position:relative;
    width:100%;
    aspect-ratio: 16 / 9;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:6px;
    overflow:hidden;
  }

  canvas{
    display:block;
    width:100%;
    height:100%;
  }

  .overlay{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(13,15,26,0.86);
    text-align:center;
    padding:24px;
  }

  .overlay[hidden]{ display:none; }

  .panel{
    max-width:420px;
    display:flex;
    flex-direction:column;
    gap:14px;
    align-items:center;
  }

  .panel h2{
    margin:0;
    font-size:26px;
    font-weight:700;
  }

  .panel .sub{
    margin:0;
    color:var(--text-muted);
    font-size:14px;
    line-height:1.6;
  }

  .rules{
    margin:0;
    padding:14px 16px;
    background:var(--surface-2);
    border:1px solid var(--line);
    border-radius:6px;
    text-align:left;
    font-size:13px;
    color:var(--text-muted);
    line-height:1.7;
  }

  .rules li{ margin:2px 0; }
  .rules b{ color:var(--text); font-weight:500; }

  .btn{
    appearance:none;
    border:none;
    cursor:pointer;
    font-family:inherit;
    font-size:14px;
    font-weight:700;
    padding:10px 20px;
    border-radius:5px;
    background:var(--accent);
    color:#0D0F1A;
    transition:transform 0.08s ease;
  }

  .btn:active{ transform:scale(0.96); }

  .btn.ghost{
    background:transparent;
    color:var(--text);
    border:1px solid var(--line);
  }

  .result-score{
    font-size:15px;
    color:var(--text-muted);
  }

  .result-score b{
    color:var(--accent-2);
    font-size:18px;
  }

  .fail-color{ color:var(--danger); }
  .success-color{ color:var(--accent); }

  .controls{
    display:flex;
    flex-wrap:wrap;
    gap:10px 22px;
    justify-content:center;
    padding-top:4px;
  }

  .ctrl{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:13px;
    color:var(--text-muted);
  }

  kbd{
    font-family:inherit;
    font-size:12px;
    font-weight:700;
    color:var(--text);
    background:var(--surface-2);
    border:1px solid var(--line);
    border-bottom-width:2px;
    border-radius:4px;
    padding:4px 8px;
    min-width:18px;
    text-align:center;
  }

  .foot-btns{
    display:flex;
    gap:10px;
    justify-content:center;
  }

  .foot-btns button{
    font-size:13px;
    padding:7px 14px;
  }

  .sr-only{
    position:absolute;
    width:1px;height:1px;
    overflow:hidden;
    clip:rect(0,0,0,0);
  }
</style>
</head>
<body>

<div class="app">
  <div class="head">
    <h1>Grid Jumper</h1>
    <div class="stats">
      <span>점수 <b id="scoreVal">0</b></span>
      <span>최고 <b id="bestVal">0</b></span>
    </div>
  </div>

  <div class="stage" id="stage">
    <canvas id="game" tabindex="0" aria-label="Grid Jumper 게임 화면"></canvas>

    <div class="overlay" id="overlayStart">
      <div class="panel">
        <h2>Grid Jumper</h2>
        <p class="sub">장애물이 다가오면 점프해서 넘고, 목표 점수에 도달하면 승리해요.</p>
        <ul class="rules">
          <li><b>목표</b> — 장애물 15개를 통과하면 성공</li>
          <li><b>실패</b> — 바닥에 있을 때 장애물과 부딪히면 게임 종료</li>
          <li><b>점프</b> — 누를 때마다 한 칸씩 위로 올라가고, 두면 다시 한 칸씩 내려와요</li>
        </ul>
        <button class="btn" id="btnStart">시작하기</button>
      </div>
    </div>

    <div class="overlay" id="overlayPause" hidden>
      <div class="panel">
        <h2>일시정지</h2>
        <p class="sub">진행 상황은 그대로 저장돼 있어요.</p>
        <button class="btn" id="btnResume">이어하기</button>
      </div>
    </div>

    <div class="overlay" id="overlayFail" hidden>
      <div class="panel">
        <h2 class="fail-color">실패</h2>
        <p class="result-score">이번 판 점수 <b id="failScore">0</b></p>
        <button class="btn" id="btnRestartFail">다시 시작</button>
      </div>
    </div>

    <div class="overlay" id="overlaySuccess" hidden>
      <div class="panel">
        <h2 class="success-color">성공!</h2>
        <p class="result-score">목표를 달성했어요 · 점수 <b id="successScore">0</b></p>
        <button class="btn" id="btnRestartSuccess">다시 시작</button>
      </div>
    </div>
  </div>

  <div class="controls">
    <span class="ctrl"><kbd>Space</kbd> / <kbd>↑</kbd> 점프 · 시작 · 재시작</span>
    <span class="ctrl"><kbd>P</kbd> 일시정지 / 재개</span>
  </div>

  <div class="foot-btns">
    <button class="btn ghost" id="btnPauseToggle">일시정지</button>
    <button class="btn ghost" id="btnRestartAlways">재시작</button>
  </div>
</div>

<script>
(function(){
  "use strict";

  // ---------- 게임 규칙 상수 ----------
  var ROWS = 3;              // 0(바닥) ~ 2(최고 높이)
  var COLS = 14;             // 가로 그리드 칸 수
  var PLAYER_COL = 2;        // 플레이어 고정 열
  var TARGET_SCORE = 15;     // 성공 조건
  var BASE_TICK_MS = 260;    // 기본 틱 간격
  var MIN_TICK_MS = 150;     // 최소(최고 속도) 틱 간격
  var SPEED_STEP_EVERY = 5;  // 점수 N마다 속도 증가
  var SPEED_STEP_MS = 15;
  var SPAWN_CHANCE = 0.35;
  var MIN_GAP_COLS = 3;

  // ---------- 상태 ----------
  var STATE = { START:'START', PLAYING:'PLAYING', PAUSED:'PAUSED', FAIL:'FAIL', SUCCESS:'SUCCESS' };
  var state = STATE.START;

  var player = { row:0 };
  var obstacles = [];        // { col:number, passed:bool }
  var score = 0;
  var best = 0;
  var tickMs = BASE_TICK_MS;
  var tickTimer = null;

  // ---------- DOM ----------
  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var stage = document.getElementById('stage');
  var scoreVal = document.getElementById('scoreVal');
  var bestVal = document.getElementById('bestVal');
  var failScore = document.getElementById('failScore');
  var successScore = document.getElementById('successScore');

  var overlays = {
    START: document.getElementById('overlayStart'),
    PAUSED: document.getElementById('overlayPause'),
    FAIL: document.getElementById('overlayFail'),
    SUCCESS: document.getElementById('overlaySuccess')
  };

  function showOverlay(name){
    Object.keys(overlays).forEach(function(key){
      overlays[key].hidden = (key !== name);
    });
  }
  function hideAllOverlays(){
    Object.keys(overlays).forEach(function(key){ overlays[key].hidden = true; });
  }

  // ---------- 초기화 / 재시작 ----------
  function resetRound(){
    player.row = 0;
    obstacles = [];
    score = 0;
    tickMs = BASE_TICK_MS;
    scoreVal.textContent = '0';
  }

  function startGame(){
    resetRound();
    state = STATE.PLAYING;
    hideAllOverlays();
    startTicking();
    draw();
  }

  function restartGame(){
    stopTicking();
    startGame();
  }

  // ---------- 틱 루프 (자동 낙하 + 장애물 이동) ----------
  function startTicking(){
    stopTicking();
    tickTimer = setInterval(tick, tickMs);
  }
  function stopTicking(){
    if(tickTimer){ clearInterval(tickTimer); tickTimer = null; }
  }
  function restartTickingWithCurrentSpeed(){
    if(state === STATE.PLAYING){ startTicking(); }
  }

  function tick(){
    if(state !== STATE.PLAYING) return;

    // 중력: 한 칸씩 자동 하강
    if(player.row > 0){ player.row -= 1; }

    // 장애물 이동
    for(var i = obstacles.length - 1; i >= 0; i--){
      obstacles[i].col -= 1;
      if(obstacles[i].col < 0){ obstacles.splice(i, 1); }
    }

    // 스폰
    var last = obstacles.length ? obstacles[obstacles.length - 1] : null;
    var canSpawn = !last || (COLS - 1 - last.col) >= MIN_GAP_COLS;
    if(canSpawn && Math.random() < SPAWN_CHANCE){
      obstacles.push({ col: COLS - 1, passed:false });
    }

    // 충돌 / 점수 판정
    for(var j = 0; j < obstacles.length; j++){
      var ob = obstacles[j];
      if(ob.col === PLAYER_COL && !ob.passed){
        ob.passed = true;
        if(player.row === 0){
          triggerFail();
          return;
        } else {
          score += 1;
          scoreVal.textContent = String(score);
          maybeSpeedUp();
          if(score >= TARGET_SCORE){
            triggerSuccess();
            return;
          }
        }
      }
    }

    draw();
  }

  function maybeSpeedUp(){
    if(score % SPEED_STEP_EVERY === 0){
      var next = Math.max(MIN_TICK_MS, BASE_TICK_MS - Math.floor(score / SPEED_STEP_EVERY) * SPEED_STEP_MS);
      if(next !== tickMs){
        tickMs = next;
        restartTickingWithCurrentSpeed();
      }
    }
  }

  // ---------- 입력에 따른 단일 상태 변화 ----------
  function jump(){
    if(state !== STATE.PLAYING) return;
    if(player.row < ROWS - 1){
      player.row += 1;   // 조작 1회 = 위로 한 칸, 명확한 단일 상태 변화
    }
    draw();
  }

  function pause(){
    if(state !== STATE.PLAYING) return;
    state = STATE.PAUSED;
    stopTicking();
    showOverlay('PAUSED');
  }

  function resume(){
    if(state !== STATE.PAUSED) return;
    state = STATE.PLAYING;
    hideAllOverlays();
    startTicking();
    draw();
  }

  function togglePause(){
    if(state === STATE.PLAYING) pause();
    else if(state === STATE.PAUSED) resume();
  }

  function triggerFail(){
    state = STATE.FAIL;
    stopTicking();
    if(score > best){ best = score; bestVal.textContent = String(best); }
    failScore.textContent = String(score);
    showOverlay('FAIL');
    draw();
  }

  function triggerSuccess(){
    state = STATE.SUCCESS;
    stopTicking();
    if(score > best){ best = score; bestVal.textContent = String(best); }
    successScore.textContent = String(score);
    showOverlay('SUCCESS');
    draw();
  }

  // ---------- 렌더링 (그리드 크기 무관, 상태만 기반으로 그림) ----------
  function resizeCanvasToStage(){
    var rect = stage.getBoundingClientRect();
    var dpr = window.devicePixelRatio || 1;
    canvas.width = Math.max(1, Math.round(rect.width * dpr));
    canvas.height = Math.max(1, Math.round(rect.height * dpr));
    draw();
  }

  function draw(){
    var w = canvas.width, h = canvas.height;
    ctx.clearRect(0, 0, w, h);

    ctx.fillStyle = '#151830';
    ctx.fillRect(0, 0, w, h);

    var cellW = w / COLS;
    var cellH = h / (ROWS + 1.4);
    var groundY = h - cellH * 1.1;

    // 그리드 라인
    ctx.strokeStyle = '#2A2F55';
    ctx.lineWidth = Math.max(1, w * 0.0015);
    for(var c = 0; c <= COLS; c++){
      var x = c * cellW;
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x, h);
      ctx.stroke();
    }
    ctx.beginPath();
    ctx.moveTo(0, groundY);
    ctx.lineTo(w, groundY);
    ctx.stroke();

    // 장애물
    ctx.fillStyle = '#FF6B5E';
    obstacles.forEach(function(ob){
      var ox = ob.col * cellW;
      var oy = groundY - cellH * 0.85;
      var pad = cellW * 0.18;
      ctx.fillRect(ox + pad, oy, cellW - pad * 2, cellH * 0.85);
    });

    // 플레이어
    var px = PLAYER_COL * cellW;
    var py = groundY - cellH * 0.85 - player.row * cellH;
    ctx.fillStyle = '#5EE6C0';
    var ppad = cellW * 0.16;
    ctx.fillRect(px + ppad, py, cellW - ppad * 2, cellH * 0.85);
  }

  // ---------- 입력 이벤트 ----------
  function handlePrimaryAction(){
    if(state === STATE.START){ startGame(); }
    else if(state === STATE.PLAYING){ jump(); }
    else if(state === STATE.PAUSED){ resume(); }
    else if(state === STATE.FAIL || state === STATE.SUCCESS){ restartGame(); }
  }

  document.addEventListener('keydown', function(e){
    if(e.code === 'Space' || e.code === 'ArrowUp'){
      e.preventDefault();
      handlePrimaryAction();
    } else if(e.code === 'KeyP' || e.code === 'Escape'){
      e.preventDefault();
      togglePause();
    } else if(e.code === 'KeyR'){
      e.preventDefault();
      if(state !== STATE.START){ restartGame(); }
    }
  });

  canvas.addEventListener('pointerdown', function(){
    canvas.focus();
    handlePrimaryAction();
  });

  document.getElementById('btnStart').addEventListener('click', startGame);
  document.getElementById('btnResume').addEventListener('click', resume);
  document.getElementById('btnRestartFail').addEventListener('click', restartGame);
  document.getElementById('btnRestartSuccess').addEventListener('click', restartGame);
  document.getElementById('btnPauseToggle').addEventListener('click', togglePause);
  document.getElementById('btnRestartAlways').addEventListener('click', function(){
    if(state !== STATE.START){ restartGame(); }
  });

  // 포커스 이탈 시 자동 일시정지, 복귀해도 상태/조작 유지 (자동 재개는 하지 않음)
  document.addEventListener('visibilitychange', function(){
    if(document.hidden && state === STATE.PLAYING){ pause(); }
  });
  window.addEventListener('blur', function(){
    if(state === STATE.PLAYING){ pause(); }
  });

  // 창 크기 변경 시에도 게임 상태는 그대로, 화면만 다시 그림
  window.addEventListener('resize', resizeCanvasToStage);
  if(window.ResizeObserver){
    new ResizeObserver(resizeCanvasToStage).observe(stage);
  }

  // ---------- 초기 진입 ----------
  resizeCanvasToStage();
  showOverlay('START');
  draw();
})();
</script>
</body>
</html>
